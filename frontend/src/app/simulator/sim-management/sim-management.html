<div>
    <input type="text" placeholder="Input barcode" #luBarcode>

    <select [(ngModel)]="selectedEntity">
        @for (entity of entities(); track entity) {
        <option [value]="entity">
            {{ entity }}
        </option>
        }
    </select>

    <button (click)=createLU(luBarcode.value)>Create LU</button>
</div>
