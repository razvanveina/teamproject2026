<div>
    <input type="text" placeholder="Input barcode" #barcode>

    <select [(ngModel)]="selectedEntity">
        @for (entity of entities(); track entity) {
        <option [value]="entity">
            {{ entity }}
        </option>
        }
    </select>

    <select [(ngModel)]="selectedType">
        @for (type of loadUnitTypes; track type) {
        <option [value]="type">
            {{ type }}
        </option>
        }
    </select>

    <button (click)=createLU(barcode.value)>Create LU</button>
</div>
