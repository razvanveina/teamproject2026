<div class="card">
    <h2>Create load unit</h2>

    <div class="fields">
        <label>
            Location
            <select [(ngModel)]="selectedEntity">
                <option value="">Select location</option>
                @for (entity of entities(); track entity) {
                <option [value]="entity">
                    {{ entity }}
                </option>
                }
            </select>
        </label>

        <label>
            Type
            <select [(ngModel)]="selectedType">
                @for (type of loadUnitTypes; track type) {
                <option [value]="type">
                    {{ type }}
                </option>
                }
            </select>
        </label>

        <label class="barcode">
            Barcode
            <input type="text" placeholder="Input barcode" #barcode (keyup.enter)="createLU(barcode.value)">
        </label>

        <button (click)=createLU(barcode.value)>Create LU</button>
    </div>

    @if (message()) {
    <p class="message" [class.error]="isError()">{{ message() }}</p>
    }
</div>
