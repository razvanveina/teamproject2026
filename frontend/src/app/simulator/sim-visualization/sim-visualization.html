@if (error()) {

<p>{{ errorMessage }}</p>

} @else {

<div class="points-grid">
    @for (point of points(); track point.id) {

    <div class="point-card">
        <p>{{ point.name }}
            @if (point.capacity != null){
            - {{point.capacity }} capacity
            }
        </p>
        <p>{{point.loadUnits }}</p>
    </div>

    }
</div>

}
