<div class="dropdown">
    <button type="button" class="dropdown-button" (click)="toggle()">Dialoguri ▾</button>

    @if (open()) {
    <ul class="dropdown-menu">
        @for (dialog of dialogs(); track dialog.id) {
        <li>
            <a [routerLink]="['/dialogs', dialog.id]" (click)="close()">{{ dialog.title }}</a>
        </li>
        }
    </ul>
    }
</div>
