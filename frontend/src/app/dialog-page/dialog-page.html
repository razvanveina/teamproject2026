@if (dialog(); as config) {
<h1>{{ config.title }}</h1>

<table>
    <tr>
        @for (column of config.columns; track column.field) {
        <th>{{ column.label }}</th>
        }
    </tr>

    @for (row of rows(); track $index) {
    <tr>
        @for (column of config.columns; track column.field) {
        <td>{{ row[column.field] }}</td>
        }
    </tr>
    }
</table>
}
