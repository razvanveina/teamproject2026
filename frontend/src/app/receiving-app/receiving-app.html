<div class="container">
    <div class="top">
        <div>
            <div class="orderDetails">
                <p>Order ID: <b>{{orderId}}</b></p>
                <p> Order Status: <b>{{orderStatus}}</b> </p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Article</th>
                        <th>Quantity</th>
                        <th>Received Quantity</th>
                        <th>Actions</th>
                    </tr>
                </thead>

            </table>
        </div>
    </div>

    <div class="left">
        <p>{{instructions}}</p>
    </div>

    <div class="right">
        <input type="text" placeholder="Scan barcode" #barcode (keyup.enter)="onScan(barcode.value)">
    </div>

    <div class="bottom">
        <button (click)=onCancel() class="cancel">Cancel</button>
    </div>
</div>
