<div class="container">
    <div class="top">
        <div>
            <div class="orderDetails">
                <p>Order ID: <b>{{orderId}}</b></p>
                <p> Order Status: <b>{{orderStatus}}</b> </p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Article</th>
                        <th>Quantity</th>
                        <th>Received Quantity</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>
                    @for (user of users(); track user.id) {
                    <tr>
                        <td><a [routerLink]="['/users/edit', user.id]">
                                {{ user.id }}
                            </a></td>
                        <td>{{ user.name }}</td>
                        <td>{{ user.email }}</td>

                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 6h18" />
                                <path d="M8 6V4h8v2" />
                                <path d="m19 6-1 14H6L5 6" />
                                <path d="M10 11v5" />
                                <path d="M14 11v5" />
                            </svg>
                        </button></td> -->
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>

    <div class="left">
        <p>{{instructions}}</p>
    </div>

    <div class="right">
        <input type="text" placeholder="Scan barcode" #barcode (keyup.enter)="onScan(barcode.value)">
    </div>

    <div class="bottom">
        <button (click)=onCancel() class="cancel">Cancel</button>
    </div>
</div>
