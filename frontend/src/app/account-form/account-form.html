<h2>Accounts - Add</h2>

@if (error()) {
<p class="error">{{ error() }}</p>
}

<form (ngSubmit)="save()">
    <div class="form-field">
        <label for="username">Username *</label>
        <input id="username" name="username" type="text" [(ngModel)]="username" autocomplete="off" />
    </div>

    <div class="form-field">
        <label for="password">Password *</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="new-password" />
    </div>

    <div class="form-field">
        <label for="confirm">Confirm password *</label>
        <input id="confirm" name="confirm" type="password" [(ngModel)]="confirm" autocomplete="new-password" />
    </div>

    <div class="form-actions">
        <button type="button" (click)="cancel()">Cancel</button>
        <button type="submit">Save</button>
    </div>
</form>
