@if (auth.isLoggedIn()) {
<nav class="main-menu">
  <a routerLink="/home" routerLinkActive="active" (click)="onNav('HOME')">
    Home
  </a>

  <app-dialog-list />

  <app-worker-dialog-list />

  <app-sim-dialog />

  <a routerLink="/processes" routerLinkActive="active">
    Processes
  </a>

  <a routerLink="/stock" routerLinkActive="active">
    Stock
  </a>

  <span class="menu-spacer"></span>

  <span class="user-badge" title="Logged in as {{ auth.username() }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21a8 8 0 0 1 16 0" />
    </svg>
    {{ auth.username() }}
  </span>

    <button type="button" class="logout-button" (click)="logout()">Logout</button>
</nav>
}

<main class="page-content">
  <router-outlet />
</main>
