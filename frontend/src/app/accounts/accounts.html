<h1>AC001 - Accounts</h1>
<div class="toolbar">
    <button type="button" class="add-button" routerLink="/accounts/add">Add</button>
    <button type="button" class="refresh-button" title="Refresh" aria-label="Refresh" (click)="refresh()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" />
            <path d="M21 3v5h-5" />
        </svg>
    </button>
</div>
@if (error()) {
<p class="error">{{ error() }}</p>
}

<table>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Delete</th>
    </tr>
    @for (account of accounts(); track account.id) {
    <tr>
        <td>{{ account.id }}</td>
        <td>{{ account.username }}</td>
        <td>
            <button type="button" class="delete-button" title="Delete" aria-label="Delete" (click)="deleteAccount(account)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M3 6h18" />
                    <path d="M8 6V4h8v2" />
                    <path d="m19 6-1 14H6L5 6" />
                    <path d="M10 11v5" />
                    <path d="M14 11v5" />
                </svg>
            </button>
        </td>
    </tr>
    }
</table>
